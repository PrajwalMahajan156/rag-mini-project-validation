name: AI Manager PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Least-privilege token: only what the script actually needs.
permissions:
  contents: read
  pull-requests: write   # needed to post/update the review comment
  issues: write          # PR comments are technically "issue" comments via the API

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # guard against a hung API call blocking the queue indefinitely

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # openai>=1.57.0 drops the deprecated 'proxies' kwarg usage that broke
        # against httpx>=0.28. Pin to 1.57.4 for a stable, reproducible build.
        run: pip install requests==2.32.3 openai==1.57.4 "httpx>=0.28.0"

      - name: Run AI Manager Audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python ai_review_engine.py
